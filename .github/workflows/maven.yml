name: Build

on: push

jobs:
  build:
	permissions:
		contents: read

    runs-on: ubuntu-latest # windows-latest, macos-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Build and test with Maven
      run: mvn -B package